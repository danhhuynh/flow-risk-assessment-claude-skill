      # Phép thử: có viết được test fail khi invariant này bị vi phạm không?
      # Nếu không → phát biểu lại cho cụ thể hơn.
      - id: TODO_inv_id
        statement: "TODO — điều gì PHẢI luôn đúng, bất kể input/thời điểm/thứ tự"
        # incident (tốt nhất, rút từ sự cố thật) | human | llm_proposed
        provenance: TODO
        incident_ref: ""
        # CHỈ 'confirmed' được tính vào điểm rủi ro.
        # llm_proposed luôn bắt đầu ở 'proposed'.
        status: TODO             # confirmed | proposed | deprecated

# ─────────────────────────────────────────────────────────────────
# Với flow có idempotent:false hoặc external_side_effects:true,
# LUÔN kiểm 4 invariant sau (thêm vào steps ở trên nếu áp dụng):
#   - Hai request đồng thời tới cùng resource không tạo double-effect
#   - Retry sau timeout không tạo double-effect
#   - Partial failure để lại state hợp lệ hoặc được cleanup
#   - Timeout của external call không làm treo transaction đang mở
# ─────────────────────────────────────────────────────────────────

